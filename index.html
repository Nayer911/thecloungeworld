<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>The C Lounge</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
}

/* Fullscreen Image */
.hero-image{
    width:100vw;
    height:100vh;
    object-fit:contain;
    object-position:center;
    user-select:none;
    -webkit-user-drag:none;
    pointer-events:none;

    animation:fadeIn 1.2s ease;
}

/* Fade Animation */
@keyframes fadeIn{
    from{
        opacity:0;
        transform:scale(1.02);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

/* Ultra Wide Monitors */
@media (min-aspect-ratio:16/9){
    .hero-image{
        object-fit:cover;
    }
}

/* Portrait Phones */
@media (max-aspect-ratio:9/16){
    .hero-image{
        object-fit:contain;
    }
}
</style>
</head>

<body>

<img
    src="lp.png"
    class="hero-image"
    alt="The C Lounge Coming Soon"
    draggable="false"
/>

</body>
</html>
